<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>TOOFEEL STAR · Учёт</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root{
    --bg:#17141A; --bg2:#1C1920; --card:#221E27; --card2:#282430;
    --line:rgba(255,255,255,.07); --line2:rgba(255,255,255,.12);
    --text:#F1EAE0; --muted:#968E9C; --faint:#6E6672;
    --gold:#E7C79B; --gold2:#C9A876;
    --sage:#A9C4A0; --amber:#E2AE73; --rose:#DE9E8E;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --serif:Georgia,"Times New Roman",serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--text); font-family:var(--sans);
    font-size:15px; line-height:1.45; letter-spacing:.1px;
    padding-bottom:104px; min-height:100vh;
    background-image:radial-gradient(120% 60% at 50% -10%, #221D28 0%, var(--bg) 60%);
  }
  .wrap{max-width:440px;margin:0 auto;padding:20px 18px 0}

  .head{display:flex;align-items:center;gap:14px;margin-bottom:22px}
  .ava{width:56px;height:56px;border-radius:50%;object-fit:cover;flex:none;border:1.5px solid var(--gold2);box-shadow:0 0 0 4px rgba(231,199,155,.06),0 6px 18px rgba(0,0,0,.4)}
  .hi{font-family:var(--serif);font-size:22px;line-height:1.1}
  .hi span{color:var(--gold)}
  .head .sub{color:var(--muted);font-size:12.5px;letter-spacing:1.4px;text-transform:uppercase;margin-top:3px}

  .hero{background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:22px;padding:22px 22px 18px;margin-bottom:18px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
  .hero .cap{color:var(--muted);font-size:12px;letter-spacing:2px;text-transform:uppercase}
  .hero .big{font-family:var(--serif);font-size:52px;line-height:1;color:var(--gold);margin:8px 0 2px;text-shadow:0 0 26px rgba(231,199,155,.28)}
  .hero .big small{font-size:24px;color:var(--gold2);margin-left:2px}
  .hero .row{display:flex;gap:10px;margin-top:18px}
  .hero .cell{flex:1;background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:14px;padding:11px 12px}
  .hero .cell .k{font-size:11px;color:var(--muted)}
  .hero .cell .v{font-family:var(--serif);font-size:19px;margin-top:3px}
  .v.in{color:var(--sage)} .v.out{color:var(--rose)} .v.exp{color:var(--amber)}

  .sec{margin:26px 0 0}
  .sec-h{display:flex;align-items:baseline;justify-content:space-between;margin:0 2px 12px}
  .sec-h h2{font-family:var(--serif);font-size:18px;font-weight:400;margin:0}
  .sec-h .right{display:flex;align-items:center;gap:10px}
  .sec-h .meta{color:var(--muted);font-size:12px}
  .addbtn{font-size:12.5px;color:var(--gold);background:rgba(231,199,155,.08);border:1px solid rgba(231,199,155,.3);padding:5px 12px;border-radius:20px;cursor:pointer;font-family:var(--sans)}
  .addbtn:active{transform:translateY(1px)}

  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 15px;margin-bottom:10px}

  .grp{display:flex;align-items:center;gap:12px}
  .grp .info{flex:1;min-width:0}
  .grp .name{font-size:15px}
  .grp .age{color:var(--muted);font-size:12.5px;margin-top:1px}
  .grp .stats{display:flex;gap:14px;margin-top:9px;flex-wrap:wrap}
  .grp .stat{font-size:12px;color:var(--muted)}
  .grp .stat b{color:var(--text);font-weight:600}
  .grp .stat.new b{color:var(--gold)} .grp .stat.tr b{color:var(--amber)} .grp .stat.inc b{color:var(--sage)}
  .ring{position:relative;width:46px;height:46px;flex:none}
  .ring .lbl{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:11.5px;color:var(--text);font-family:var(--serif)}
  .grpadd{width:34px;height:34px;border-radius:50%;flex:none;border:1px solid rgba(231,199,155,.3);background:rgba(231,199,155,.08);color:var(--gold);font-size:19px;line-height:1;cursor:pointer;font-family:var(--serif)}
  .grpadd:active{transform:translateY(1px)}

  .pay{display:flex;align-items:center;gap:12px;padding:11px 4px;border-bottom:1px solid var(--line);cursor:pointer}
  .pay:last-child{border-bottom:none}
  .pay .dot{width:9px;height:9px;border-radius:50%;flex:none}
  .dot.ok{background:var(--sage);box-shadow:0 0 8px rgba(169,196,160,.6)}
  .dot.no{background:var(--amber);box-shadow:0 0 8px rgba(226,174,115,.5)}
  .dot.tr{background:var(--gold);box-shadow:0 0 8px rgba(231,199,155,.5)}
  .pay .nm{flex:1;min-width:0}
  .pay .nm .n{font-size:14.5px}
  .pay .nm .g{font-size:11.5px;color:var(--faint);margin-top:1px}
  .disc{color:var(--gold2);background:rgba(231,199,155,.1);border:1px solid rgba(231,199,155,.22);padding:0 6px;border-radius:10px;font-size:10.5px}
  .pay .st{font-size:12px;text-align:right;flex:none}
  .st.ok{color:var(--sage)} .st.no{color:var(--amber)} .st.tr{color:var(--gold)}
  .st .price{display:block;color:var(--muted);font-size:11px;margin-top:1px}
  .del{width:28px;height:28px;border-radius:50%;flex:none;border:none;background:transparent;color:var(--faint);font-size:14px;cursor:pointer;margin-left:4px}
  .del:active{color:var(--rose);background:rgba(222,158,142,.12)}

  .exp{display:flex;align-items:center;gap:12px;padding:11px 4px;border-bottom:1px solid var(--line)}
  .exp:last-child{border-bottom:none}
  .exp .d{font-size:11px;color:var(--faint);width:34px;flex:none;font-variant-numeric:tabular-nums}
  .exp .body{flex:1;min-width:0}
  .exp .t{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .chip{display:inline-block;font-size:10.5px;color:var(--gold2);background:rgba(231,199,155,.09);border:1px solid rgba(231,199,155,.18);padding:1px 8px;border-radius:20px;margin-top:4px}
  .exp .a{font-family:var(--serif);font-size:16px;color:var(--rose);flex:none}
  .exp-total{display:flex;justify-content:space-between;padding:13px 4px 2px;margin-top:2px;border-top:1px solid var(--line2)}
  .exp-total .a{font-family:var(--serif);font-size:18px;color:var(--rose)}

  .year{background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:12px}
  .year .yr{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:14px}
  .year .yr .l{color:var(--muted);font-size:12px;letter-spacing:1.4px;text-transform:uppercase}
  .year .yr .p{font-family:var(--serif);font-size:30px;color:var(--gold);text-shadow:0 0 20px rgba(231,199,155,.22)}
  .ybar{display:flex;gap:10px;margin-bottom:4px}
  .ybar .c{flex:1;text-align:center}
  .ybar .c .k{font-size:11px;color:var(--muted)}
  .ybar .c .v{font-family:var(--serif);font-size:16px;margin-top:3px}
  .subttl{font-size:11px;color:var(--muted);letter-spacing:1.2px;text-transform:uppercase;margin:16px 2px 8px}
  .mlist{margin-top:2px}
  .mrow{display:flex;align-items:center;gap:12px;padding:9px 2px;border-bottom:1px solid var(--line)}
  .mrow:last-child{border-bottom:none}
  .mrow .mn{width:110px;font-size:13px;color:var(--text)}
  .mtrack{flex:1;height:6px;border-radius:6px;background:rgba(255,255,255,.05);overflow:hidden}
  .mfill{height:100%;background:linear-gradient(90deg,var(--gold2),var(--gold));border-radius:6px}
  .mrow .mp{width:82px;text-align:right;font-family:var(--serif);font-size:14px;color:var(--gold)}
  .mrow.cur .mn{color:var(--gold)}
  .reset{display:block;margin:18px auto 4px;color:var(--faint);font-size:12px;background:none;border:none;cursor:pointer;text-decoration:underline}

  .bar{position:fixed;left:0;right:0;bottom:0;z-index:40;background:linear-gradient(180deg,rgba(23,20,26,0),var(--bg) 26%);padding:16px 18px calc(18px + env(safe-area-inset-bottom));display:flex;justify-content:center}
  .bar .inner{width:100%;max-width:440px;display:flex;gap:10px}
  .btn{flex:1;border:none;border-radius:15px;padding:15px 12px;font-size:15px;font-family:var(--sans);cursor:pointer;font-weight:600}
  .btn.primary{flex:1.35;color:#231C10;background:linear-gradient(180deg,var(--gold),var(--gold2));box-shadow:0 8px 22px rgba(231,199,155,.28)}
  .btn.ghost{color:var(--text);background:transparent;border:1px solid var(--line2)}
  .btn:active{transform:translateY(1px)}

  .ov{position:fixed;inset:0;z-index:50;background:rgba(8,6,10,.6);opacity:0;pointer-events:none;transition:opacity .2s}
  .ov.on{opacity:1;pointer-events:auto}
  .sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;background:var(--bg2);border-top-left-radius:24px;border-top-right-radius:24px;border-top:1px solid var(--line2);padding:8px 18px calc(20px + env(safe-area-inset-bottom));max-width:440px;margin:0 auto;transform:translateY(110%);transition:transform .26s cubic-bezier(.2,.7,.2,1);max-height:88vh;overflow-y:auto}
  .sheet.on{transform:translateY(0)}
  .grip{width:38px;height:4px;border-radius:4px;background:var(--line2);margin:8px auto 14px}
  .sheet h3{font-family:var(--serif);font-weight:400;font-size:20px;margin:0 0 16px}
  .field{margin-bottom:14px}
  .field label{display:block;font-size:12px;color:var(--muted);margin-bottom:7px}
  .cats{display:flex;flex-wrap:wrap;gap:8px}
  .cat{padding:8px 13px;border-radius:20px;font-size:13px;color:var(--muted);background:var(--card);border:1px solid var(--line);cursor:pointer}
  .cat.sel{color:#231C10;background:var(--gold);border-color:var(--gold)}
  .tin{width:100%;background:var(--card);border:1px solid var(--line2);border-radius:12px;color:var(--text);font-family:var(--sans);font-size:15px;padding:13px 14px;outline:none}
  .tin::placeholder{color:var(--faint)}
  .pricebox{display:flex;align-items:center;background:var(--card);border:1px solid var(--line2);border-radius:14px;padding:2px 14px}
  .pricebox input{flex:1;background:none;border:none;outline:none;color:var(--text);font-family:var(--serif);font-size:28px;padding:12px 0}
  .pricebox .cur{font-family:var(--serif);font-size:22px;color:var(--gold2)}
  .hint{font-size:12px;color:var(--faint);margin-top:6px;padding-left:2px}
  .togglerow{display:flex;align-items:center;justify-content:space-between}
  .togglerow span{font-size:14px;color:var(--text)}
  .tgl{width:46px;height:27px;border-radius:20px;background:var(--card);border:1px solid var(--line2);position:relative;cursor:pointer;transition:.2s;flex:none}
  .tgl::after{content:"";position:absolute;top:2px;left:2px;width:21px;height:21px;border-radius:50%;background:var(--muted);transition:.2s}
  .tgl.on{background:linear-gradient(180deg,var(--gold),var(--gold2));border-color:var(--gold)}
  .tgl.on::after{left:21px;background:#231C10}
  input[type=date].tin{color:var(--text)}
  input[type=date].tin::-webkit-calendar-picker-indicator{filter:invert(.8) sepia(.4) saturate(4) hue-rotate(2deg)}
  .save{width:100%;border:none;border-radius:14px;padding:16px;font-size:16px;font-weight:600;color:#231C10;background:linear-gradient(180deg,var(--gold),var(--gold2));margin-top:6px;cursor:pointer}
  .delbtn{width:100%;border:1px solid rgba(222,158,142,.45);background:transparent;color:var(--rose);border-radius:14px;padding:14px;font-size:15px;margin-top:10px;cursor:pointer;font-family:var(--sans)}
  .delbtn:active{background:rgba(222,158,142,.1)}
  .hintline{font-size:11.5px;color:var(--faint);margin:8px 4px 0;text-align:center}
  .cfm{position:fixed;inset:0;z-index:70;display:none;align-items:center;justify-content:center;background:rgba(8,6,10,.66);padding:24px}
  .cfm.on{display:flex}
  .cfm-box{background:var(--bg2);border:1px solid var(--line2);border-radius:20px;padding:22px;max-width:340px;width:100%;box-shadow:0 20px 50px rgba(0,0,0,.55)}
  .cfm-msg{font-size:15px;line-height:1.5;margin-bottom:18px;text-align:center;color:var(--text)}
  .cfm-row{display:flex;gap:10px}
  .cfm-no{flex:1;border:1px solid var(--line2);background:transparent;color:var(--text);border-radius:12px;padding:13px;font-size:15px;cursor:pointer;font-family:var(--sans)}
  .cfm-yes{flex:1;border:none;background:linear-gradient(180deg,var(--rose),#c98476);color:#2a1712;border-radius:12px;padding:13px;font-size:15px;font-weight:600;cursor:pointer;font-family:var(--sans)}
  .cfm-no:active,.cfm-yes:active{transform:translateY(1px)}
  .empty-sheet{color:var(--muted);text-align:center;padding:24px 0;font-size:14px}

  .toast{position:fixed;left:50%;bottom:120px;transform:translate(-50%,20px);z-index:60;background:var(--card2);border:1px solid var(--line2);color:var(--text);padding:12px 18px;border-radius:30px;font-size:13.5px;opacity:0;transition:.25s;pointer-events:none;box-shadow:0 10px 30px rgba(0,0,0,.5)}
  .toast.on{opacity:1;transform:translate(-50%,0)}

  .fallback{max-width:360px;margin:80px auto;text-align:center;padding:0 24px}
  .fallback .em{font-family:var(--serif);font-size:40px;color:var(--gold);margin-bottom:12px}
  .fallback h2{font-family:var(--serif);font-weight:400;font-size:22px;margin:0 0 8px}
  .fallback p{color:var(--muted);font-size:14px;line-height:1.6}
  .fallback button{margin-top:20px;border:1px solid var(--line2);background:transparent;color:var(--text);padding:12px 22px;border-radius:12px;font-size:14px;cursor:pointer}
</style>
</head>
<body>

<div id="app"></div>
<div class="toast" id="toast"></div>
<div class="ov" id="ov" onclick="closeSheet()"></div>

<!-- своё окно подтверждения (системное confirm не работает в Telegram) -->
<div class="cfm" id="cfm">
  <div class="cfm-box">
    <div class="cfm-msg" id="cfmMsg"></div>
    <div class="cfm-row">
      <button class="cfm-no" onclick="cfmClose()">Отмена</button>
      <button class="cfm-yes" onclick="cfmYes()">Удалить</button>
    </div>
  </div>
</div>

<!-- лист: расход -->
<div class="sheet" id="sheetExp">
  <div class="grip"></div>
  <h3>Новый расход</h3>
  <div class="field"><label>Сумма</label>
    <div class="pricebox"><input id="expAmt" type="number" inputmode="numeric" placeholder="0"><span class="cur">₽</span></div></div>
  <div class="field"><label>Категория</label><div class="cats" id="expCats"></div></div>
  <div class="field"><label>Что это</label><input class="tin" id="expTitle" placeholder="Например: аренда зала"></div>
  <button class="save" onclick="addExpense()">Добавить расход</button>
</div>

<!-- лист: отметить оплату -->
<div class="sheet" id="sheetPay">
  <div class="grip"></div>
  <h3>Кто оплатил</h3>
  <div class="plist" id="payList"></div>
</div>

<!-- лист: новый ученик -->
<div class="sheet" id="sheetStu">
  <div class="grip"></div>
  <h3 id="stuTitle">Новый ученик</h3>
  <div class="field"><label>Имя</label><input class="tin" id="stuName" placeholder="Например: София Р."></div>
  <div class="field"><label>Направление</label><div class="cats" id="stuDirs"></div></div>
  <div class="field"><label>Тип оплаты</label><div class="cats" id="stuModes"></div></div>
  <div class="field" id="stuPriceWrap"><label>Цена, ₽</label>
    <div class="pricebox"><input id="stuPrice" type="number" inputmode="numeric" placeholder="напр. 5500"><span class="cur">₽</span></div>
    <div class="hint" id="stuHint"></div></div>
  <div class="field togglerow" id="stuPaidRow"><span>Уже оплатила</span><div class="tgl" id="stuPaid" onclick="tgl('stuPaid');toggleDate()"></div></div>
  <div class="field" id="stuDateWrap" style="display:none"><label>Дата оплаты</label><input class="tin" type="date" id="stuPayDate"></div>
  <div class="field togglerow"><span>Новенькая</span><div class="tgl on" id="stuNew" onclick="tgl('stuNew')"></div></div>
  <div class="field"><label>Пометка (по желанию)</label><input class="tin" id="stuNote" placeholder="скидка, семья, «2 часа»…"></div>
  <button class="save" id="stuSave" onclick="saveStu()">Добавить ученика</button>
  <button class="delbtn" id="stuDelBtn" style="display:none" onclick="delStudentFromSheet()">Удалить ученика</button>
</div>

<script>
try{ if(window.Telegram && Telegram.WebApp){ Telegram.WebApp.ready(); Telegram.WebApp.expand(); } }catch(e){}

/* ---------- встроенная копия данных (чтобы открывалось двойным кликом) ---------- */
var EMBEDDED_DATA = {
  "owner": { "name": "Мария", "school": "TOOFEEL STAR" },
  "currentMonth": { "key": "2026-07", "label": "Июль 2026", "paidUntilLabel": "до 1 августа" },
  "directions": [
    { "id": "g1", "name": "Базовый курс",    "sub": "4–7 лет",   "capacity": 10 },
    { "id": "g2", "name": "Базовый курс",    "sub": "8–11 лет",  "capacity": 12 },
    { "id": "g3", "name": "Базовый курс",    "sub": "12–16 лет", "capacity": 12 },
    { "id": "d1", "name": "Модельный старт", "sub": "интенсив",   "capacity": 16 },
    { "id": "d2", "name": "Индивидуальные",  "sub": "по занятиям","capacity": 0 },
    { "id": "d3", "name": "Театр моды",      "sub": "шоу-показ",  "capacity": 20 },
    { "id": "d4", "name": "Взрослые",        "sub": "с нуля",     "capacity": 12 }
  ],
  "students": [],
  "expenseCategories": ["Аренда зала", "Реквизит", "Реклама", "Съёмки", "Костюмы", "Педагог", "Другое"],
  "expenses": [],
  "monthlyHistory": []
};

/* ---------- state + сохранение на устройстве ---------- */
var DATA=null, S=[], EXP=[];
var STORE='toofeel_uchet_v3';
var fmt=function(n){ return new Intl.NumberFormat('ru-RU').format(Math.round(n)); };
var $=function(id){ return document.getElementById(id); };
function clone(x){ return Object.assign({},x); }
function saveState(){ try{ localStorage.setItem(STORE, JSON.stringify({students:S,expenses:EXP})); }catch(e){} }
function loadState(){ try{ var r=localStorage.getItem(STORE); return r?JSON.parse(r):null; }catch(e){ return null; } }
function resetState(){ try{ localStorage.removeItem(STORE); }catch(e){}; location.reload(); }

function boot(d){
  try{
    DATA=d;
    var saved=loadState();
    if(saved && saved.students){ S=saved.students; EXP=saved.expenses||[]; }
    else { S=d.students.map(clone); EXP=d.expenses.map(clone); }
    render();
  }catch(e){ showFallback(); console.error(e); }
}
fetch('data.json?v=' + Date.now())
  .then(function(r){ if(!r.ok) throw new Error('status '+r.status); return r.json(); })
  .then(boot)
  .catch(function(){ boot(EMBEDDED_DATA); });

/* ---------- helpers ---------- */
function dirById(id){ return DATA.directions.find(function(d){return d.id===id;}); }
function isBase(d){ return d && d.name==='Базовый курс'; }
function fmtDate(iso){ if(!iso)return''; var p=iso.split('-'); return p[2]+'.'+p[1]; }
function todayISO(){ var d=new Date(); return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2); }
function priceLabel(st){
  if(st.mode==='trial') return 'бесплатно';
  if(st.mode==='once')  return fmt(st.price)+' ₽ · разово';
  return fmt(st.price)+' ₽/мес';
}
function countsIncome(st){ return st.paid && st.mode!=='trial'; }
function countsDebt(st){ return !st.paid && st.mode!=='trial'; }

function compute(){
  var income=0, expected=0;
  S.forEach(function(st){ if(countsIncome(st)) income+=st.price; else if(countsDebt(st)) expected+=st.price; });
  var spent=EXP.reduce(function(a,e){return a+e.amount;},0);
  var left=income-spent;
  var histIn=DATA.monthlyHistory.reduce(function(a,m){return a+m.income;},0);
  var histEx=DATA.monthlyHistory.reduce(function(a,m){return a+m.expense;},0);
  var yearIn=histIn+income, yearEx=histEx+spent, yearProfit=yearIn-yearEx;
  var months=DATA.monthlyHistory.map(function(m){return {label:m.label,profit:m.income-m.expense,cur:false};});
  months.push({label:DATA.currentMonth.label.split(' ')[0], profit:left, cur:true});
  return {income:income,expected:expected,spent:spent,left:left,yearIn:yearIn,yearEx:yearEx,yearProfit:yearProfit,months:months};
}

/* доход по направлениям (базовые объединены), за текущий месяц */
function byDirection(){
  var order=[], map={};
  DATA.directions.forEach(function(d){ var k=isBase(d)?'Базовый курс':d.name; if(!(k in map)){map[k]=0;order.push(k);} });
  S.forEach(function(st){ if(countsIncome(st)){ var d=dirById(st.dirId); if(!d)return; var k=isBase(d)?'Базовый курс':d.name; map[k]+=st.price; } });
  return order.map(function(k){return {name:k,income:map[k]};});
}

/* ---------- render ---------- */
function render(){
  saveState();
  var c=compute(), cm=DATA.currentMonth;
  var maxP=Math.max.apply(null, c.months.map(function(m){return Math.max(m.profit,1);}));

  var dirsHtml=DATA.directions.map(function(d){
    var st=S.filter(function(x){return x.dirId===d.id;});
    var paid=st.filter(function(x){return countsIncome(x);}).length;
    var trials=st.filter(function(x){return x.mode==='trial';}).length;
    var neu=st.filter(function(x){return x.isNew;}).length;
    var inc=st.reduce(function(a,x){return a+(countsIncome(x)?x.price:0);},0);
    var occ=st.length;
    var ring;
    if(d.capacity>0){
      var dash=2*Math.PI*20, off=dash*(1-Math.min(occ/d.capacity,1));
      ring='<svg width="46" height="46"><circle cx="23" cy="23" r="20" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="4"/>'+
           '<circle cx="23" cy="23" r="20" fill="none" stroke="var(--gold)" stroke-width="4" stroke-linecap="round" stroke-dasharray="'+dash.toFixed(1)+'" stroke-dashoffset="'+off.toFixed(1)+'"/></svg>'+
           '<div class="lbl">'+occ+'/'+d.capacity+'</div>';
    } else {
      ring='<svg width="46" height="46"><circle cx="23" cy="23" r="20" fill="none" stroke="rgba(231,199,155,.25)" stroke-width="4"/></svg><div class="lbl">'+occ+'</div>';
    }
    return '<div class="card grp">'+
      '<div class="ring">'+ring+'</div>'+
      '<div class="info"><div class="name">'+d.name+'</div>'+
        '<div class="age">'+d.sub+'</div>'+
        '<div class="stats">'+
          '<span class="stat">оплатили <b>'+paid+'</b></span>'+
          (inc>0?'<span class="stat inc">в месяц <b>'+fmt(inc)+' ₽</b></span>':'')+
          (trials>0?'<span class="stat tr">пробных <b>+'+trials+'</b></span>':'')+
          (neu>0?'<span class="stat new">новых <b>+'+neu+'</b></span>':'')+
        '</div></div>'+
      '<button class="grpadd" title="Добавить сюда" onclick="openStu(\''+d.id+'\')">+</button>'+
    '</div>';
  }).join('');

  var paysHtml=S.length? S.map(function(st){
    var d=dirById(st.dirId); if(!d) return '';

      '<div class="g">'+d.name+(d.sub?' · '+d.sub:'')+(st.note?' · <span class="disc">'+st.note+'</span>':'')+'</div></div>'+

  var expHtml=EXP.length? EXP.map(function(e){
    return '<div class="exp"><div class="d">'+e.date+'</div>'+
      '<div class="body"><div class="t">'+e.title+'</div><span class="chip">'+e.category+'</span></div>'+
      '<div class="a">−'+fmt(e.amount)+'</div>'+
      '<button class="del" title="Удалить расход" onclick="delExpense(\''+e.id+'\')">✕</button></div>';

    return '<div class="mrow"><div class="mn">'+x.name+'</div>'+
      '<div class="mtrack"><div class="mfill" style="width:'+w+'%"></div></div>'+
      '<div class="mp">'+fmt(x.income)+' ₽</div></div>';

          '<div class="c"><div class="k">Расход</div><div class="v" style="color:var(--rose)">'+fmt(c.yearEx)+' ₽</div></div>'+
          '<div class="c"><div class="k">Месяцев</div><div class="v">'+c.months.length+'</div></div>'+
        '</div>'+
        '<div class="subttl">Доход по направлениям · '+cm.label.split(' ')[0]+'</div>'+
        '<div class="mlist">'+dirHtml+'</div>'+
        '<div class="subttl">Прибыль по месяцам</div>'+
        '<div class="mlist">'+monthsHtml+'</div>'+
      '</div>'+
      '<button class="reset" onclick="askConfirm(\'Очистить все записи? Ученики, оплаты и расходы удалятся.\', resetState)">↺ очистить все записи</button>'+
    '</div>'+
  '</div>';
}

/* ---------- своё подтверждение ---------- */
var cfmCb=null;
function askConfirm(msg,cb){ cfmCb=cb; $('cfmMsg').textContent=msg; $('cfm').classList.add('on'); }
function cfmClose(){ $('cfm').classList.remove('on'); cfmCb=null; }
function cfmYes(){ var cb=cfmCb; cfmClose(); if(cb) cb(); }

/* ---------- удаление ---------- */
function delStudent(id){
  var st=S.find(function(x){return x.id===id;}); if(!st)return;
  askConfirm('Удалить ученика «'+st.name+'»?', function(){
    S=S.filter(function(x){return x.id!==id;}); render(); toast('Ученик удалён');
  });
}
function delExpense(id){
  var e=EXP.find(function(x){return x.id===id;}); if(!e)return;
  askConfirm('Удалить расход «'+e.title+'» на '+fmt(e.amount)+' ₽?', function(){
    EXP=EXP.filter(function(x){return x.id!==id;}); render(); toast('Расход удалён');
  });
}

/* ---------- оплата ---------- */
function togglePay(id){
  var st=S.find(function(x){return x.id===id;}); if(!st)return;
  if(st.mode==='trial'){ toast('Пробное — оплата не нужна'); return; }
  st.paid=!st.paid; st.payDate=st.paid?todayISO():null; render();
  toast(st.paid?st.name+' — оплата отмечена':st.name+' — оплата снята');
}
function openPay(){
  var unpaid=S.filter(function(x){return countsDebt(x);});
  if(unpaid.length===0){ $('payList').innerHTML='<div class="empty-sheet">Все оплатили. Красота ✦</div>'; }
  else{
    $('payList').innerHTML=unpaid.map(function(st){
      var d=dirById(st.dirId);
      return '<div class="pay" onclick="markPaid(\''+st.id+'\')"><span class="dot no"></span>'+
        '<div class="nm"><div class="n">'+st.name+'</div><div class="g">'+d.name+(d.sub?' · '+d.sub:'')+'</div></div>'+
        '<div class="st no">'+priceLabel(st)+'<span class="price">отметить</span></div></div>';
    }).join('');
  }
  openSheet('sheetPay');
}
function markPaid(id){
  var st=S.find(function(x){return x.id===id;}); if(!st)return;
  st.paid=true; st.payDate=todayISO(); toast(st.name+' — оплатила ✦');
  var left=S.filter(function(x){return countsDebt(x);});
  if(left.length===0){ closeSheet(); render(); return; }
  openPay(); render();
}

/* ---------- расход ---------- */
var selCat=null;
function openExp(){
  selCat=DATA.expenseCategories[0];
  $('expCats').innerHTML=DATA.expenseCategories.map(function(cat,i){ return '<div class="cat'+(i===0?' sel':'')+'" onclick="pickCat(this,\''+cat+'\')">'+cat+'</div>'; }).join('');
  $('expAmt').value=''; $('expTitle').value=''; openSheet('sheetExp');
  setTimeout(function(){ $('expAmt').focus(); },300);
}
function pickCat(el,cat){ selCat=cat; Array.prototype.forEach.call(document.querySelectorAll('#expCats .cat'),function(c){c.classList.remove('sel');}); el.classList.add('sel'); }
function addExpense(){
  var amt=parseInt($('expAmt').value,10);
  if(!amt||amt<=0){ toast('Впиши сумму'); return; }
  var dt=new Date(), dd=('0'+dt.getDate()).slice(-2)+'.'+('0'+(dt.getMonth()+1)).slice(-2);
  EXP.unshift({id:'e'+Date.now(),date:dd,category:selCat,title:$('expTitle').value.trim()||selCat,amount:amt});
  closeSheet(); render(); toast('Расход добавлен: −'+fmt(amt)+' ₽');
}

/* ---------- новый ученик ---------- */
var dirSel=null, modeSel='month', editId=null;
var MODES=[{v:'trial',l:'Пробное · бесплатно'},{v:'once',l:'Разовое'},{v:'month',l:'За месяц'}];
function tgl(id){ $(id).classList.toggle('on'); }
function toggleDate(){ $('stuDateWrap').style.display=$('stuPaid').classList.contains('on')?'block':'none'; }

function renderDirChips(){
  $('stuDirs').innerHTML=DATA.directions.map(function(x){
    var lab=x.name.replace('Базовый курс','Базовый')+(isBase(x)?' · '+x.sub:'');
    return '<div class="cat'+(x.id===dirSel?' sel':'')+'" onclick="pickDir(this,\''+x.id+'\')">'+lab+'</div>';
  }).join('');
}

/* добавление нового */
function openStu(preDir){
  editId=null;
  $('stuTitle').textContent='Новый ученик';
  $('stuSave').textContent='Добавить ученика';
  $('stuDelBtn').style.display='none';
  dirSel=preDir||DATA.directions[0].id;
  modeSel = (dirSel==='d2') ? 'once' : 'month';
  $('stuName').value=''; $('stuPrice').value=''; $('stuNote').value='';
  $('stuPaid').classList.remove('on'); $('stuNew').classList.add('on');
  $('stuPayDate').value=todayISO();
  renderDirChips(); renderModes(); refreshMode();
  openSheet('sheetStu');
  setTimeout(function(){ $('stuName').focus(); },300);
}

/* редактирование существующего (по тапу на ученика) */
function openStuEdit(id){
  var st=S.find(function(x){return x.id===id;}); if(!st)return;
  editId=id;
  $('stuTitle').textContent='Изменить';
  $('stuSave').textContent='Сохранить';
  $('stuDelBtn').style.display='block';
  dirSel=st.dirId; modeSel=st.mode;
  $('stuName').value=st.name;
  $('stuPrice').value=st.price?st.price:'';
  $('stuNote').value=st.note||'';
  $('stuPaid').classList.toggle('on', !!st.paid);
  $('stuNew').classList.toggle('on', !!st.isNew);
  $('stuPayDate').value=st.payDate||todayISO();
  renderDirChips(); renderModes(); refreshMode();
  openSheet('sheetStu');
}

function renderModes(){
  $('stuModes').innerHTML=MODES.map(function(m){ return '<div class="cat'+(m.v===modeSel?' sel':'')+'" onclick="pickMode(this,\''+m.v+'\')">'+m.l+'</div>'; }).join('');
}
function pickDir(el,id){
  dirSel=id;
  Array.prototype.forEach.call(document.querySelectorAll('#stuDirs .cat'),function(c){c.classList.remove('sel');});
  el.classList.add('sel'); refreshMode();
}
function pickMode(el,v){
  modeSel=v;
  Array.prototype.forEach.call(document.querySelectorAll('#stuModes .cat'),function(c){c.classList.remove('sel');});
  el.classList.add('sel'); refreshMode();
}
function refreshMode(){
  var d=dirById(dirSel), base=isBase(d);
  if(modeSel==='trial'){
    $('stuPriceWrap').style.display='none';
    $('stuPaidRow').style.display='none';
    $('stuDateWrap').style.display='none';
  } else {
    $('stuPriceWrap').style.display='block';
    $('stuPaidRow').style.display='flex';
    toggleDate();
    var ph='напр. 5500', hint='';
    if(modeSel==='once' && base){ ph='600'; hint='У базового разовое — 600 ₽ (2 часа). Можно изменить.'; }
    else if(modeSel==='once'){ ph='напр. 1500'; hint='Цена за одно занятие.'; }
    else { hint='Цена за месяц занятий.'; }
    $('stuPrice').placeholder=ph; $('stuHint').textContent=hint;
  }
}
function saveStu(){
  var name=$('stuName').value.trim();
  if(!name){ toast('Впиши имя'); return; }
  var price=0, paid=false, payDate=null;
  if(modeSel!=='trial'){
    price=parseInt($('stuPrice').value,10);
    if(!price||price<=0){ toast('Впиши цену'); return; }
    paid=$('stuPaid').classList.contains('on');
    payDate=paid?($('stuPayDate').value||todayISO()):null;
  }
  var obj={ name:name, dirId:dirSel, mode:modeSel, price:price,
            paid:paid, isNew:$('stuNew').classList.contains('on'),
            note:$('stuNote').value.trim(), payDate:payDate };
  if(editId){
    var st=S.find(function(x){return x.id===editId;});
    if(st) Object.assign(st, obj);
    closeSheet(); render(); toast(name+' — изменения сохранены');
  } else {
    obj.id='s'+Date.now(); S.push(obj);
    closeSheet(); render(); toast(name+' — добавлена ✦');
  }
}
function delStudentFromSheet(){
  if(!editId) return;
  var st=S.find(function(x){return x.id===editId;});
  if(!st) return;
  var id=editId;
  askConfirm('Удалить ученика «'+st.name+'»?', function(){
    S=S.filter(function(x){return x.id!==id;});
    closeSheet(); render(); toast('Ученик удалён');
  });
}

/* ---------- sheet/toast/fallback ---------- */
var curSheet=null;
function openSheet(id){ curSheet=id; $('ov').classList.add('on'); $(id).classList.add('on'); }
function closeSheet(){ $('ov').classList.remove('on'); if(curSheet){$(curSheet).classList.remove('on');curSheet=null;} }
var tT=null;
function toast(msg){ var t=$('toast'); t.textContent=msg; t.classList.add('on'); clearTimeout(tT); tT=setTimeout(function(){t.classList.remove('on');},1900); }
function showFallback(){
  $('app').innerHTML='<div class="fallback"><div class="em">✦</div><h2>Данные не загрузились</h2>'+
  '<p>Проверь, что data.json лежит рядом с приложением, и попробуй ещё раз.</p>'+
  '<button onclick="location.reload()">Обновить</button></div>';
}

(function(){
  var bar=document.createElement('div'); bar.className='bar';
  bar.innerHTML='<div class="inner"><button class="btn primary" onclick="openExp()">+ Расход</button><button class="btn ghost" onclick="openPay()">Отметить оплату</button></div>';
  document.body.appendChild(bar);
})();
</script>
</body>
</html>
